name: DataGW - Gold Data

on:
  workflow_dispatch:

jobs:
  update-gold:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Yahoo Finance fetcher
        run: |
          python scripts/yahoo_fetch.py

      - name: Show generated JSON
        run: |
          echo "===== data/gold.json ====="
          cat data/gold.json

      - name: Commit updated gold.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gold.json

          if git diff --cached --quiet; then
            echo "Keine Änderung an gold.json."
          else
            git commit -m "Update gold market data"
            git push
          fi
