name: DataGW - Market Data

on:
  workflow_dispatch:

  schedule:
    - cron: "30 23 * * *"
      timezone: "Europe/Berlin"

jobs:
  update-markets:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Yahoo Finance fetcher
        run: |
          python scripts/yahoo_fetch.py

      - name: Run DataGW V2 Consumer Test
        run: |
          python scripts/test_datagw_consumer.py

      - name: Run Yahoo History Capability Test
        run: |
          python scripts/test_history_capability.py

      - name: Run Indicator Engine Integration Test
        run: |
          python scripts/test_indicator_engine_integration.py

      - name: Verify generated JSON files
        run: |
          echo "===== Generated market data ====="

          for file in \
            data/gold.json \
            data/silver.json \
            data/brent.json \
            data/dax.json \
            data/sp500.json \
            data/nasdaq100.json \
            data/dowjones.json
          do
            echo ""
            echo "===== $file ====="

            if [ -f "$file" ]; then
              echo "OK: Datei vorhanden"
              python -m json.tool "$file" > /dev/null
              echo "OK: JSON gültig"
            else
              echo "FEHLER: Datei fehlt!"
              exit 1
            fi
          done

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/gold.json \
            data/silver.json \
            data/brent.json \
            data/dax.json \
            data/sp500.json \
            data/nasdaq100.json \
            data/dowjones.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Marktdaten."
          else
            echo "Änderungen an den Marktdaten gefunden."
            git commit -m "Update market data"
            git push
          fi
