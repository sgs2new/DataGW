name: DataGW - Yahoo Finance Test

on:
  workflow_dispatch:

jobs:
  yahoo-test:
    runs-on: ubuntu-latest

    steps:
      - name: Show runner information
        run: |
          echo "GitHub Runner ist gestartet."
          python --version

      - name: Test Yahoo Finance - GC=F
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://query2.finance.yahoo.com/v8/finance/chart/GC=F?interval=1d&range=5d"

          print("Yahoo-Endpoint:")
          print(url)
          print()

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          result = data["chart"]["result"][0]
          meta = result["meta"]
          timestamps = result["timestamp"]
          quote = result["indicators"]["quote"][0]

          print("Yahoo Finance antwortet erfolgreich.")
          print("Symbol:", meta.get("symbol"))
          print("Anzahl Kerzen:", len(timestamps))
          print()

          print("Letzte Kerze:")
          print("Timestamp:", timestamps[-1])
          print("Open:     ", quote["open"][-1])
          print("High:     ", quote["high"][-1])
          print("Low:      ", quote["low"][-1])
          print("Close:    ", quote["close"][-1])

          if not all([
              quote["open"][-1],
              quote["high"][-1],
              quote["low"][-1],
              quote["close"][-1]
          ]):
              raise RuntimeError("OHLC-Daten sind unvollständig.")

          print()
          print("TEST ERFOLGREICH: Yahoo GC=F liefert OHLC-Daten.")
          PY
